<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Demo Web AR — Clínica</title>

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>
  :root{
    color-scheme: dark;
    --bg: #0b0c10;
    --accent: #17d1a3;
    --accent-dark: #0fae86;
    --text: #f4f6f7;
    --muted: #9aa3a8;
  }
  *{ box-sizing: border-box; }
  html, body{
    margin:0; padding:0; width:100%; height:100%;
    background: transparent;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  /* El fondo oscuro NO va en html/body: un background sólido ahí pinta por
     encima de cualquier hijo con z-index negativo (el <video> de cámara que
     inyecta AR.js), tapando la cámara por completo. Cada pantalla que
     necesita fondo opaco (#boot-screen, #lead-gate) ya lo define ella misma. */
  a-scene{ position:fixed; inset:0; z-index:1; }

  /* ---- Pantalla de arranque (pide cámara / carga) ---- */
  #boot-screen{
    position:fixed; inset:0; z-index:50;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; text-align:center; padding:24px;
    background: radial-gradient(circle at 50% 30%, #14161c 0%, #08090b 100%);
    transition: opacity .4s ease;
  }
  #boot-screen.hidden{ opacity:0; pointer-events:none; }
  #boot-screen .spinner{
    width:42px; height:42px; border-radius:50%;
    border:3px solid rgba(23,209,163,.2); border-top-color: var(--accent);
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }
  #boot-screen h1{ font-size:1.05rem; font-weight:600; margin:0; }
  #boot-screen p{ font-size:.85rem; color:var(--muted); margin:0; max-width:280px; }

  /* ---- Control de sonido (overlay DOM) ---- */
  #sound-control{
    position:fixed; top:16px; right:16px; z-index:20;
    display:flex; align-items:center; gap:8px;
    opacity:0; pointer-events:none;
    transition: opacity .3s ease;
  }
  #sound-control.visible{ opacity:1; pointer-events:auto; }
  #sound-toggle{
    display:flex; align-items:center; gap:6px;
    background:rgba(11,12,16,.72); backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,.08); border-radius:999px;
    padding:8px 14px; font-size:.78rem; color:var(--text); font-weight:600;
    cursor:pointer; -webkit-tap-highlight-color:transparent;
    transition: background .15s ease, border-color .15s ease, color .15s ease, transform .12s ease;
  }
  #sound-toggle:active{ transform: scale(.96); }
  #sound-toggle.unmuted{ border-color: var(--accent); color: var(--accent); }
  #sound-toggle svg{ width:16px; height:16px; }
  #volume-slider-wrap{
    display:none; align-items:center;
    background:rgba(11,12,16,.72); backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,.08); border-radius:999px;
    padding:6px 12px;
  }
  #volume-slider-wrap.visible{ display:flex; }
  #volume-slider{
    width:90px; accent-color: var(--accent);
  }

  #toast{
    position:fixed; left:50%; bottom:112px; transform:translateX(-50%) translateY(10px);
    z-index:40; background: var(--accent); color:#04211a; font-weight:700; font-size:.8rem;
    padding:9px 16px; border-radius:999px; opacity:0; pointer-events:none;
    transition: opacity .25s ease, transform .25s ease;
    white-space:nowrap;
  }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* ---- Gate de captura de leads (tapa la escena hasta completar el formulario) ---- */
  #lead-gate{
    position:fixed; inset:0; z-index:60;
    display:flex; align-items:center; justify-content:center;
    padding:24px;
    background: radial-gradient(circle at 50% 30%, #14161c 0%, #08090b 100%);
    transition: opacity .4s ease;
  }
  #lead-gate.hidden{ opacity:0; pointer-events:none; }
  #lead-gate .gate-card{
    width:100%; max-width:340px; text-align:center;
    background: rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.08);
    border-radius:20px; padding:28px 22px; backdrop-filter:blur(6px);
  }
  #lead-gate h1{
    font-size:1.15rem; font-weight:700; margin:0 0 8px; color:var(--text);
  }
  #lead-gate p{
    font-size:.85rem; color:var(--muted); margin:0 0 20px;
  }
  #lead-gate .gate-status{
    font-size:.75rem; color:var(--accent); margin:-10px 0 16px; font-weight:600;
  }
  #lead-gate label{
    display:block; text-align:left; font-size:.72rem; color:var(--muted);
    margin:0 0 6px; text-transform:uppercase; letter-spacing:.05em;
  }
  #lead-gate .gate-field{ margin-bottom:14px; }
  #lead-gate input{
    width:100%; padding:12px 14px; border-radius:12px;
    border:1px solid rgba(255,255,255,.12); background:rgba(11,12,16,.6);
    color:var(--text); font-size:.95rem; font-family:inherit;
  }
  #lead-gate input:focus{ outline:none; border-color:var(--accent); }
  #lead-gate button[type="submit"]{
    width:100%; margin-top:6px; padding:13px 14px; border:none; border-radius:12px;
    background: var(--accent); color:#04211a; font-weight:700; font-size:.95rem;
    cursor:pointer; -webkit-tap-highlight-color:transparent;
    transition: transform .12s ease, background .15s ease;
  }
  #lead-gate button[type="submit"]:active{ transform: scale(.97); background: var(--accent-dark); }
  #lead-gate .gate-error{
    font-size:.75rem; color:#ff8a80; margin:-6px 0 14px; text-align:left; display:none;
  }
  #lead-gate .gate-error.visible{ display:block; }
</style>
</head>
<body>

<!-- ============================================================
     CONFIG — EDITAR ESTOS VALORES ANTES DE PUBLICAR
     ============================================================ -->
<script>
  const CONFIG = {
    // número de WhatsApp con código de país, solo dígitos
    WHATSAPP_NUMBER: "543812124512",
    WHATSAPP_MESSAGE: "Hola! Acabo de activar mi Acceso Exclusivo. Quiero más info sobre la Oportunidad de hoy",

    // usuario de Instagram (sin @)
    INSTAGRAM_HANDLE: "as.esteticatucuman",

    // código de cupón que se copia al portapapeles
    CUPON_CODE: "PROMO001",

    // Webhook de Zapier (Catch Hook → Google Sheets: Create Spreadsheet Row)
    ZAPIER_WEBHOOK_URL: "https://hook.us2.make.com/jwg1pabbeyl2bqf0gx7k9ka3ddy72bxh",

    // Nombre de la promo/tratamiento que se registra en el CRM al interactuar
    TRATAMIENTO_PROMO: "Consulta general (Demo AR)"
  };
</script>

<!-- ============================================================
     GATE DE ACCESO EXCLUSIVO — captura de lead antes de mostrar la escena AR
     ============================================================ -->
<div id="lead-gate">
  <div class="gate-card">
    <h1>Estás a un paso de una Oportunidad Única.</h1>
    <p>Ingresá tus datos para obtener Acceso Exclusivo</p>
    <form id="gate-form" novalidate>
      <p class="gate-status">Preparando tratamiento inmersivo...</p>
      <div class="gate-field">
        <label for="gate-nombre">Nombre</label>
        <input id="gate-nombre" name="nombre" type="text" autocomplete="name" required>
      </div>
      <div class="gate-field">
        <label for="gate-whatsapp">WhatsApp</label>
        <input id="gate-whatsapp" name="whatsapp" type="tel" inputmode="tel" autocomplete="tel" required>
      </div>
      <div class="gate-error" id="gate-error">Completá tu nombre y WhatsApp para continuar.</div>
      <button type="submit">Obtener Mi Acceso</button>
    </form>
  </div>
</div>

<!-- ============================================================
     PANTALLA DE ARRANQUE
     ============================================================ -->
<div id="boot-screen">
  <div class="spinner"></div>
  <h1>Preparando tu experiencia AR</h1>
  <p>Vamos a pedirte permiso de cámara para mostrarte la oferta.</p>
</div>

<div id="sound-control">
  <button id="sound-toggle" type="button" aria-label="Activar sonido">
    <svg id="sound-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
      <line x1="23" y1="9" x2="17" y2="15"></line>
      <line x1="17" y1="9" x2="23" y2="15"></line>
    </svg>
    <span id="sound-label">Activar sonido</span>
  </button>
  <div id="volume-slider-wrap">
    <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="1">
  </div>
</div>

<!-- ============================================================
     ESCENA AR.js — marcador HIRO real (video + botones anclados al marcador)
     ============================================================ -->
<a-scene
  id="ar-scene"
  embedded
  vr-mode-ui="enabled: false"
  ar-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
  renderer="precision: medium; antialias: false; logarithmicDepthBuffer: true; colorManagement: true; sortObjects: true; powerPreference: high-performance; alpha: true;"
  loading-screen="enabled: false">

  <a-assets>
    <video
      id="offer-video"
      data-src="demo-clinica.oferta.mp4.mp4"
      preload="none"
      loop
      muted
      playsinline
      webkit-playsinline
      crossorigin="anonymous"></video>
  </a-assets>

  <!-- Marcador HIRO real: video y botones vuelven a anclarse a él, con smoothing
       agresivo para eliminar el temblor de pose que antes motivó pasar a HUD fijo. -->
  <a-marker preset="hiro" smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">
    <a-video
      src="#offer-video"
      width="1"
      height="1.77"
      scale="3 3 3"
      position="0 2.77 0"
      material="shader: flat"></a-video>

    <a-entity id="btn3d-whatsapp" class="btn3d" position="-1.05 -0.15 0" scale="1.6 1.6 1.6"
      animation="property: scale; from: 1.6 1.6 1.6; to: 1.76 1.76 1.76; dir: alternate; dur: 850; loop: true; easing: easeInOutSine; delay: 0">
      <a-plane class="raycastable" width="0.58" height="0.16" color="#25d366" radius="0.04"
        material="shader: flat; opacity: 0.95"></a-plane>
      <a-text value="WhatsApp Exclusivo" align="center" color="#04211a" width="1.1"
        position="0 0 0.01"></a-text>
    </a-entity>

    <a-entity id="btn3d-cupon" class="btn3d" position="0 -0.15 0" scale="1.6 1.6 1.6"
      animation="property: scale; from: 1.6 1.6 1.6; to: 1.76 1.76 1.76; dir: alternate; dur: 850; loop: true; easing: easeInOutSine; delay: 130">
      <a-plane class="raycastable" width="0.58" height="0.16" color="#17d1a3" radius="0.04"
        material="shader: flat; opacity: 0.95"></a-plane>
      <a-text id="btn3d-cupon-text" value="Cupón Oportunidad" align="center" color="#04211a" width="1.05"
        position="0 0 0.01"></a-text>
    </a-entity>

    <a-entity id="btn3d-instagram" class="btn3d" position="1.05 -0.15 0" scale="1.6 1.6 1.6"
      animation="property: scale; from: 1.6 1.6 1.6; to: 1.76 1.76 1.76; dir: alternate; dur: 850; loop: true; easing: easeInOutSine; delay: 260">
      <a-plane class="raycastable" width="0.58" height="0.16" color="#e1306c" radius="0.04"
        material="shader: flat; opacity: 0.95"></a-plane>
      <a-text value="Instagram" align="center" color="#ffffff" width="1.1"
        position="0 0 0.01"></a-text>
    </a-entity>
  </a-marker>

  <a-entity camera
    raycaster="objects: .raycastable; far: 10"
    cursor="rayOrigin: mouse; fuse: false">
  </a-entity>
</a-scene>

<div id="toast"></div>

<script>
(function(){
  "use strict";

  const leadGate      = document.getElementById("lead-gate");
  const gateForm       = document.getElementById("gate-form");
  const gateNombre      = document.getElementById("gate-nombre");
  const gateWhatsapp     = document.getElementById("gate-whatsapp");
  const gateError         = document.getElementById("gate-error");
  const bootScreen   = document.getElementById("boot-screen");
  const arScene       = document.getElementById("ar-scene");
  const offerVideo     = document.getElementById("offer-video");
  const toastEl         = document.getElementById("toast");
  const soundControl    = document.getElementById("sound-control");
  const soundToggle     = document.getElementById("sound-toggle");
  const soundLabel      = document.getElementById("sound-label");
  const volumeWrap       = document.getElementById("volume-slider-wrap");
  const volumeSlider     = document.getElementById("volume-slider");

  let audioUnlocked   = false;
  let videoSourceLoaded = false;
  let leadNombre = "";
  let leadWhatsapp = "";

  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    setTimeout(() => toastEl.classList.remove("show"), 2200);
  }

  // ---- Audio y volumen ----
  function setMuted(muted){
    offerVideo.muted = muted;
    audioUnlocked = !muted;
    soundToggle.classList.toggle("unmuted", !muted);
    soundLabel.textContent = muted ? "Activar sonido" : "Silenciar";
    volumeWrap.classList.toggle("visible", !muted);
  }

  function setVolume(vol){
    offerVideo.volume = vol;
  }

  soundToggle.addEventListener("click", function(){
    setMuted(audioUnlocked);
  });

  volumeSlider.addEventListener("input", function(){
    setVolume(parseFloat(volumeSlider.value));
  });

  function hideBoot(){
    bootScreen.classList.add("hidden");
    setTimeout(() => { bootScreen.style.display = "none"; }, 450);
  }

  // ---- Revelado: la cámara ya está lista; el video/botones recién aparecen cuando
  // el marcador HIRO se detecte (ver markerFound más abajo) ----
  function revealContent(){
    hideBoot();

    if (!videoSourceLoaded) {
      videoSourceLoaded = true;
      offerVideo.src = offerVideo.dataset.src;
      offerVideo.load();
    }

    const p = offerVideo.play();
    if (p && p.catch) p.catch(function(){});
  }

  // ---- Arranque: cámara lista o no soportada ----
  function boot(){
    const supportsCamera = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);

    if (!supportsCamera) {
      revealContent();
      return;
    }

    // AR.js dispara arjs-video-loaded/camera-error en `window`, no en <a-scene>
    // (ver three.js/src/threex/arjs-source.js) — escuchar en arScene nunca los recibía.
    window.addEventListener("arjs-video-loaded", revealContent);
    window.addEventListener("camera-error", revealContent);

    // El botón de sonido recién se muestra la primera vez que el marcador HIRO
    // se detecta, para no invitar a tocarlo antes de que haya algo en pantalla.
    const marker = arScene.querySelector("a-marker");
    if (marker) {
      marker.addEventListener("markerFound", function(){
        soundControl.classList.add("visible");
      }, { once: true });
    }

    // El atributo arjs recién se setea acá (no en el HTML estático) para que
    // getUserMedia se pida justo después del Lead Gate, no al parsear la página.
    arScene.setAttribute("arjs",
      "sourceType: webcam; debugUIEnabled: false; detectionMode: mono; " +
      "sourceWidth: 640; sourceHeight: 480; displayWidth: 640; displayHeight: 480;");

    // Failsafe: si arjs-video-loaded nunca dispara, no dejar la pantalla de carga trabada
    setTimeout(function(){
      if (bootScreen.style.display !== "none") revealContent();
    }, 8000);
  }

  document.addEventListener("DOMContentLoaded", function(){
    logToCRM("Visita recibida en sala de espera");
  });

  // ---- CRM: log a Google Sheets vía Zapier Webhook (4 campos: whatsapp, nombre, tratamiento, estado) ----
  function logToCRM(tratamiento, nombre, whatsapp, estado){
    if (!CONFIG.ZAPIER_WEBHOOK_URL || CONFIG.ZAPIER_WEBHOOK_URL.indexOf("PEGAR_URL") !== -1) {
      console.warn("[CRM] ZAPIER_WEBHOOK_URL no configurada, se omite el registro.");
      return;
    }

    const payload = {
      nombre: nombre || "",
      whatsapp: whatsapp || "",
      tratamiento: tratamiento,
      estado: estado || "En conversación"
    };

    fetch(CONFIG.ZAPIER_WEBHOOK_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    }).catch(function(err){
      console.warn("[CRM] No se pudo registrar la acción:", err);
    });
  }

  // ---- Gate de Acceso Exclusivo: captura el lead real y recién ahí arranca la cámara/escena AR ----
  function hideGate(){
    leadGate.classList.add("hidden");
    setTimeout(() => { leadGate.style.display = "none"; }, 450);
  }

  gateForm.addEventListener("submit", function(e){
    e.preventDefault();
    const nombre = gateNombre.value.trim();
    const whatsapp = gateWhatsapp.value.trim();

    if (!nombre || !whatsapp) {
      gateError.classList.add("visible");
      return;
    }
    gateError.classList.remove("visible");

    leadNombre = nombre;
    leadWhatsapp = whatsapp;

    logToCRM("Acceso Exclusivo (Lead Gate)", nombre, whatsapp, "Nuevo Lead");
    hideGate();
    setTimeout(boot, 500);
  });

  // ---- Botones de acción (usados por los 3 botones 3D) ----
  function handleWhatsappClick(){
    logToCRM("WhatsApp Exclusivo", leadNombre, leadWhatsapp, "Click botón WhatsApp");
    const url = "https://wa.me/" + CONFIG.WHATSAPP_NUMBER + "?text=" + encodeURIComponent(CONFIG.WHATSAPP_MESSAGE);
    window.open(url, "_blank");
  }

  function handleInstagramClick(){
    logToCRM("Instagram", leadNombre, leadWhatsapp, "Click botón Instagram");
    window.open("https://instagram.com/" + CONFIG.INSTAGRAM_HANDLE, "_blank");
  }

  function fallbackCopy(text){
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try { document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
  }

  function handleCuponClick(){
    logToCRM("Cupón Oportunidad", leadNombre, leadWhatsapp, "Click botón Cupón");
    const cupon3dText = document.getElementById("btn3d-cupon-text");

    function onCopied(){
      if (cupon3dText) cupon3dText.setAttribute("value", "¡Copiado!");
      if (window.Swal) {
        Swal.fire({
          title: "Cupón Oportunidad Copiado",
          html: "Código: <b>" + CONFIG.CUPON_CODE + "</b><br>Validez 24 hs. Pegalo en el chat de WhatsApp para validar tu beneficio.",
          icon: "success"
        });
      } else {
        showToast("Cupón copiado: " + CONFIG.CUPON_CODE);
      }
      setTimeout(function(){
        if (cupon3dText) cupon3dText.setAttribute("value", "Cupón Oportunidad");
      }, 2000);
    }

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(CONFIG.CUPON_CODE).then(onCopied).catch(function(){
        fallbackCopy(CONFIG.CUPON_CODE);
        onCopied();
      });
    } else {
      fallbackCopy(CONFIG.CUPON_CODE);
      onCopied();
    }
  }

  document.getElementById("btn3d-whatsapp").addEventListener("click", handleWhatsappClick);
  document.getElementById("btn3d-instagram").addEventListener("click", handleInstagramClick);
  document.getElementById("btn3d-cupon").addEventListener("click", handleCuponClick);

})();
</script>

</body>
</html>

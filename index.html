<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Ruleta de Premios — ARhook</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@700;800&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

<style>
  :root{
    color-scheme: dark;
    --bg: #0A0A0A;
    --cyan: #00E5FF;
    --amber: #F5A623;
    --text: #F2F5F5;
    --muted: #9AA3A3;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body{
    margin:0; padding:0; width:100%; height:100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Montserrat', sans-serif;
    overflow:hidden;
  }
  h1, h2, h3, .heading{ font-family:'League Spartan', sans-serif; }

  /* ================= Fase 1: fondo de cámara ================= */
  #camera-bg{
    position:fixed; inset:0; z-index:0;
    width:100%; height:100%; object-fit:cover;
    background:#000;
  }
  #fallback-bg{
    position:fixed; inset:0; z-index:0;
    display:none;
    background: linear-gradient(160deg, #0A0A0A 0%, #1A1A1A 100%);
  }

  /* ================= utilidades compartidas ================= */
  .phase{
    position:fixed; inset:0; z-index:10;
    display:flex; align-items:center; justify-content:center;
    padding: calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));
    opacity:1;
    transition: opacity .35s ease;
  }
  .phase.phase-hidden{ display:none; }
  .phase.fade-out{ opacity:0; }

  .glass-panel{
    width:100%; max-width:360px;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.14);
    border-radius: 24px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    padding: 28px 24px;
    text-align:center;
    box-shadow: 0 20px 60px rgba(0,0,0,.45);
  }

  /* ================= Fase "game": encabezado (logo + nombre del negocio) ================= */
  #phase-game{ flex-direction:column; gap:24px; }
  #phase-game #logo-img{
    max-width:120px; max-height:70px; object-fit:contain;
    margin:0 auto; display:block;
  }
  #phase-game #logo-fallback{
    display:none; font-size:1.8rem; margin:0 auto;
  }
  #biz-title{
    font-size:1.15rem; font-weight:800; margin:0; text-align:center;
    color:var(--text);
  }

  /* ================= Juego: ruleta ================= */
  #game-wheel-container{ display:flex; flex-direction:column; align-items:center; gap:20px; }
  #wheel-wrap{
    position:relative;
    width:min(88vw, 400px); height:min(88vw, 400px);
  }
  /* Halo de rayos detrás de la ruleta, en los colores de marca — gira lento
     y pulsa de forma independiente al giro de la ruleta en sí. */
  #wheel-wrap::before{
    content:'';
    position:absolute; inset:-16%;
    z-index:0;
    border-radius:50%;
    background: conic-gradient(from 0deg,
      var(--amber) 0deg, transparent 40deg,
      var(--cyan) 90deg, transparent 130deg,
      var(--amber) 180deg, transparent 220deg,
      var(--cyan) 270deg, transparent 310deg,
      var(--amber) 360deg);
    filter: blur(16px);
    opacity:.5;
    animation: wheel-rays-spin 16s linear infinite, wheel-rays-pulse 3.4s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes wheel-rays-spin{ to{ transform:rotate(360deg); } }
  @keyframes wheel-rays-pulse{ 0%,100%{ opacity:.4; } 50%{ opacity:.65; } }
  #wheel-svg{
    position:relative; z-index:1;
    width:100%; height:100%;
    filter: drop-shadow(0 10px 30px rgba(0,0,0,.5));
  }
  .wheel-bulb{ animation: bulb-twinkle 1.6s ease-in-out infinite; }
  @keyframes bulb-twinkle{ 0%,100%{ opacity:.35; } 50%{ opacity:1; } }
  #wheel-pointer{
    position:absolute; top:-10px; left:50%; z-index:2;
    width:26px; height:34px;
    transform:translateX(-50%);
    background: linear-gradient(160deg,
      var(--amber-light, var(--amber)), var(--amber) 55%, var(--amber-dark, var(--amber)));
    clip-path: polygon(50% 100%, 0% 35%, 20% 0%, 80% 0%, 100% 35%);
    filter: drop-shadow(0 4px 8px rgba(0,0,0,.55));
    animation: pointer-bounce 1.8s ease-in-out infinite;
  }
  @keyframes pointer-bounce{
    0%,100%{ transform:translateX(-50%) translateY(0); }
    50%{ transform:translateX(-50%) translateY(3px); }
  }
  #btn-girar{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    z-index:3;
    width:82px; height:82px; border-radius:50%;
    border:3px solid var(--bg);
    background: radial-gradient(circle at 35% 28%,
      var(--amber-light, var(--amber)), var(--amber) 55%, var(--amber-dark, var(--amber)));
    color:#1A1200;
    font-family:'League Spartan', sans-serif;
    font-weight:800; font-size:1rem; letter-spacing:.03em;
    cursor:pointer;
    overflow:hidden;
    box-shadow: 0 8px 20px rgba(0,0,0,.5);
    transition: transform .12s ease, opacity .2s ease;
    animation: btn-girar-glow 2.2s ease-in-out infinite;
  }
  #btn-girar::after{
    content:'';
    position:absolute; inset:0;
    background: linear-gradient(115deg, transparent 25%, rgba(255,255,255,.55) 50%, transparent 75%);
    transform: translateX(-120%);
    animation: btn-girar-shine 3.4s ease-in-out infinite;
  }
  @keyframes btn-girar-glow{
    0%,100%{ box-shadow: 0 8px 20px rgba(0,0,0,.5), 0 0 0 0 var(--amber-glow, transparent); }
    50%{ box-shadow: 0 8px 20px rgba(0,0,0,.5), 0 0 18px 6px var(--amber-glow, transparent); }
  }
  @keyframes btn-girar-shine{
    0%, 15%{ transform:translateX(-120%); }
    45%, 100%{ transform:translateX(120%); }
  }
  #btn-girar:active{ transform:translate(-50%,-50%) scale(.94); }
  #btn-girar:disabled{ opacity:.65; cursor:default; }
  #btn-girar:disabled, #btn-girar:disabled::after{ animation-play-state:paused; }

  /* ================= Juego: raspadita ================= */
  #game-scratch-container{ display:flex; flex-direction:column; align-items:center; gap:18px; }
  #scratch-wrap{
    position:relative;
    width:min(88vw, 400px); height:min(52vw, 220px);
    border-radius:20px; overflow:hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,.5);
    animation: scratch-glow 3s ease-in-out infinite;
  }
  @keyframes scratch-glow{
    0%,100%{ box-shadow: 0 10px 30px rgba(0,0,0,.5), 0 0 0 0 var(--cyan-glow, transparent); }
    50%{ box-shadow: 0 10px 30px rgba(0,0,0,.5), 0 0 22px 2px var(--cyan-glow, transparent); }
  }
  #scratch-wrap::after{
    content:'';
    position:absolute; inset:0; z-index:2;
    pointer-events:none;
    background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.35) 50%, transparent 70%);
    transform: translateX(-140%);
    animation: scratch-shine 4.5s ease-in-out infinite;
  }
  @keyframes scratch-shine{
    0%, 20%{ transform:translateX(-140%); }
    55%, 100%{ transform:translateX(140%); }
  }
  #scratch-prize-label{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    text-align:center; padding:0 16px;
    font-family:'League Spartan', sans-serif; font-weight:800; font-size:1.25rem;
    color: var(--cyan);
    background: rgba(255,255,255,.06);
  }
  #scratch-canvas{
    position:absolute; inset:0;
    width:100%; height:100%;
    cursor:pointer;
  }
  #btn-reveal{
    background:transparent; border:1px solid rgba(255,255,255,.3);
    color: var(--muted); padding:10px 18px; border-radius:10px;
    font-family:inherit; font-size:.8rem; cursor:pointer;
    transition: box-shadow .2s ease, border-color .2s ease;
  }
  #btn-reveal:active{ box-shadow: 0 0 14px 1px var(--cyan-glow, transparent); border-color: var(--cyan); }

  /* ================= Fase claim-form: formulario final ================= */
  #claim-form label{
    display:block; text-align:left; font-size:.7rem; color:var(--muted);
    margin:0 0 6px; text-transform:uppercase; letter-spacing:.06em; font-weight:600;
  }
  #claim-form .field{ margin-bottom:14px; }
  #claim-form input{
    width:100%; padding:13px 14px; border-radius:12px;
    border:1px solid rgba(255,255,255,.16); background:rgba(0,0,0,.35);
    color:var(--text); font-size:1rem; font-family:inherit;
    min-height:46px;
  }
  #claim-form input:focus{ outline:none; border-color:var(--cyan); }
  #btn-claim-submit{
    width:100%; margin-top:8px; padding:15px 14px; border:none; border-radius:14px;
    min-height:48px;
    background: var(--cyan); color:#04211a; font-weight:700; font-size:1rem;
    font-family:inherit;
    cursor:pointer;
    transition: transform .12s ease, opacity .2s ease;
  }
  #btn-claim-submit:active{ transform: scale(.97); }
  #btn-claim-submit:disabled{ opacity:.6; cursor:default; }
  #phase-claim-form p.premio-text{
    font-size:1.1rem; color:var(--cyan); font-weight:800; margin:0 0 4px;
  }
  #phase-claim-form p.sub{
    font-size:.85rem; color:var(--muted); margin:0 0 22px;
  }

  /* ================= Fase modal: resultado / reclamo ================= */
  #phase-modal h2{
    font-size:1.4rem; font-weight:800; margin:0 0 6px; color:var(--cyan);
  }
  #phase-modal p.premio-text{
    font-size:1.05rem; color:var(--text); margin:0 0 22px; font-weight:600;
  }
  #btn-reclamar{
    display:block; width:100%; text-decoration:none;
    padding:16px 14px; border:none; border-radius:14px;
    min-height:50px;
    background: var(--amber); color:#1A1200; font-weight:700; font-size:.98rem;
    font-family:inherit;
    cursor:pointer;
    animation: pulse-btn 1.4s ease-in-out infinite;
  }
  @keyframes pulse-btn{
    0%,100%{ transform:scale(1); box-shadow:0 0 0 rgba(245,166,35,.4); }
    50%{ transform:scale(1.045); box-shadow:0 0 22px rgba(245,166,35,.55); }
  }

  /* ================= Fase duplicate: ya participó ================= */
  #phase-duplicate h2{
    font-size:1.4rem; font-weight:800; margin:0 0 10px; color:var(--text);
  }
  #phase-duplicate p.premio-text{
    font-size:1rem; color:var(--muted); margin:0; font-weight:500;
  }

  @media (max-height: 560px){
    .glass-panel{ padding:20px 18px; }
    #wheel-wrap{ width:min(76vw, 300px); height:min(76vw, 300px); }
    #scratch-wrap{ height:min(46vw, 190px); }
  }
</style>
</head>
<body>

<!-- ================= Fase 1: fondo de cámara ================= -->
<video id="camera-bg" autoplay muted playsinline webkit-playsinline></video>
<div id="fallback-bg"></div>

<!-- Audio silencioso en loop: fuerza a iOS Safari a usar la categoría de sesión
     "playback", que ignora la llavecita física de silencio del costado del iPhone.
     Sin esto, el Web Audio API (los tonos de la ruleta) puede quedar mudo aunque
     el AudioContext esté "running", si el celular tiene el switch en silencio. -->
<audio id="silent-unlock" src="data:audio/wav;base64,UklGRkQDAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YSADAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgA==" loop playsinline webkit-playsinline preload="auto"></audio>

<!-- ================= Fase "game": encabezado + juego (ruleta o raspadita) ================= -->
<div id="phase-game" class="phase">
  <img id="logo-img" src="" alt="Logo del negocio">
  <div id="logo-fallback">🎡</div>
  <h1 id="biz-title">¡Jugá y Ganá!</h1>

  <div id="game-wheel-container">
    <div id="wheel-wrap">
      <div id="wheel-pointer" aria-hidden="true"></div>
      <svg id="wheel-svg" viewBox="0 0 350 350">
        <g id="wheel-group"></g>
      </svg>
      <button id="btn-girar" type="button" aria-label="Girar la ruleta">GIRAR</button>
    </div>
  </div>

  <div id="game-scratch-container">
    <div id="scratch-wrap">
      <div id="scratch-prize-label"></div>
      <canvas id="scratch-canvas"></canvas>
    </div>
    <button id="btn-reveal" type="button">Revelar premio</button>
  </div>
</div>

<!-- ================= Fase claim-form: formulario final (nombre + hasta 2 preguntas opcionales + whatsapp) ================= -->
<div id="phase-claim-form" class="phase phase-hidden">
  <div class="glass-panel">
    <p class="premio-text" id="premio-ganado-texto">Ganaste un premio.</p>
    <p class="sub">Completá tus datos para reclamarlo al instante.</p>
    <form id="claim-form" novalidate>
      <div class="field">
        <label for="claim-nombre">Nombre</label>
        <input id="claim-nombre" name="nombre" type="text" autocomplete="name" required>
      </div>
      <div id="claim-preguntas-container"></div>
      <div class="field">
        <label for="claim-whatsapp">WhatsApp</label>
        <input id="claim-whatsapp" name="whatsapp" type="tel" inputmode="tel" autocomplete="tel" required>
      </div>
      <button id="btn-claim-submit" type="submit">Continuar</button>
    </form>
  </div>
</div>

<!-- ================= Fase modal: reclamo por WhatsApp ================= -->
<div id="phase-modal" class="phase phase-hidden">
  <div class="glass-panel">
    <h2>🎉 ¡Felicitaciones!</h2>
    <p class="premio-text" id="premio-texto">Ganaste un premio.</p>
    <button id="btn-reclamar" type="button" aria-label="Reclamar premio en WhatsApp">🎁 Reclamar mi Premio en WhatsApp</button>
  </div>
</div>

<!-- ================= Fase duplicate: ya participó con este WhatsApp en esta campaña ================= -->
<div id="phase-duplicate" class="phase phase-hidden">
  <div class="glass-panel">
    <h2>Ya participaste 🙌</h2>
    <p class="premio-text">Este WhatsApp ya jugó y reclamó un premio hace poco en esta campaña. ¡Gracias por tu interés, volvé a intentar más adelante!</p>
  </div>
</div>

<script src="assets/js/weighted-random.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/colors.js"></script>
<script src="assets/js/crm.js"></script>
<script src="assets/js/wheel.js"></script>
<script src="assets/js/scratch.js"></script>
<script src="assets/js/app.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Demo Web AR — Clínica</title>

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>
  :root{
    color-scheme: dark;
    --bg: #0b0c10;
    --accent: #17d1a3;
    --accent-dark: #0fae86;
    --text: #f4f6f7;
    --muted: #9aa3a8;
  }
  *{ box-sizing: border-box; }
  html, body{
    margin:0; padding:0; width:100%; height:100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  a-scene{ position:fixed; inset:0; z-index:1; }

  /* ---- Pantalla de arranque (pide cámara / carga) ---- */
  #boot-screen{
    position:fixed; inset:0; z-index:50;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; text-align:center; padding:24px;
    background: radial-gradient(circle at 50% 30%, #14161c 0%, #08090b 100%);
    transition: opacity .4s ease;
  }
  #boot-screen.hidden{ opacity:0; pointer-events:none; }
  #boot-screen .spinner{
    width:42px; height:42px; border-radius:50%;
    border:3px solid rgba(23,209,163,.2); border-top-color: var(--accent);
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }
  #boot-screen h1{ font-size:1.05rem; font-weight:600; margin:0; }
  #boot-screen p{ font-size:.85rem; color:var(--muted); margin:0; max-width:280px; }

  /* ---- Tarjeta HIRO (guía visual mientras no se detecta marcador) ---- */
  #marker-hint{
    position:fixed; top:16px; left:50%; transform:translateX(-50%);
    z-index:20; background:rgba(11,12,16,.72); backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,.08); border-radius:999px;
    padding:8px 16px; font-size:.78rem; color:var(--muted);
    display:flex; align-items:center; gap:8px; transition: opacity .3s ease;
  }
  #marker-hint.hidden{ opacity:0; pointer-events:none; }
  #marker-hint .dot{
    width:7px; height:7px; border-radius:50%; background: var(--accent);
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{ opacity:1;} 50%{ opacity:.3;} }

  /* ---- Control de sonido (overlay DOM, mismo estilo que #marker-hint) ---- */
  #sound-control{
    position:fixed; top:16px; right:16px; z-index:20;
    display:flex; align-items:center; gap:8px;
  }
  #sound-toggle{
    display:flex; align-items:center; gap:6px;
    background:rgba(11,12,16,.72); backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,.08); border-radius:999px;
    padding:8px 14px; font-size:.78rem; color:var(--text); font-weight:600;
    cursor:pointer; -webkit-tap-highlight-color:transparent;
    transition: background .15s ease, border-color .15s ease, color .15s ease, transform .12s ease;
  }
  #sound-toggle:active{ transform: scale(.96); }
  #sound-toggle.unmuted{ border-color: var(--accent); color: var(--accent); }
  #sound-toggle svg{ width:16px; height:16px; }
  #volume-slider-wrap{
    display:none; align-items:center;
    background:rgba(11,12,16,.72); backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,.08); border-radius:999px;
    padding:6px 12px;
  }
  #volume-slider-wrap.visible{ display:flex; }
  #volume-slider{
    width:90px; accent-color: var(--accent);
  }

  #toast{
    position:fixed; left:50%; bottom:112px; transform:translateX(-50%) translateY(10px);
    z-index:40; background: var(--accent); color:#04211a; font-weight:700; font-size:.8rem;
    padding:9px 16px; border-radius:999px; opacity:0; pointer-events:none;
    transition: opacity .25s ease, transform .25s ease;
    white-space:nowrap;
  }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<!-- ============================================================
     CONFIG — EDITAR ESTOS VALORES ANTES DE PUBLICAR
     ============================================================ -->
<script>
  const CONFIG = {
    // número de WhatsApp con código de país, solo dígitos
    WHATSAPP_NUMBER: "543812124512",
    WHATSAPP_MESSAGE: "Hola! Vi la demo AR y quiero consultar por un tratamiento.",

    // usuario de Instagram (sin @)
    INSTAGRAM_HANDLE: "as.esteticatucuman",

    // código de cupón que se copia al portapapeles
    CUPON_CODE: "PROMO001",

    // Webhook de Zapier (Catch Hook → Google Sheets: Create Spreadsheet Row)
    ZAPIER_WEBHOOK_URL: "https://hooks.zapier.com/hooks/catch/28340642/44folof/",

    // Nombre de la promo/tratamiento que se registra en el CRM al interactuar
    TRATAMIENTO_PROMO: "Consulta general (Demo AR)"
  };
</script>

<!-- ============================================================
     PANTALLA DE ARRANQUE
     ============================================================ -->
<div id="boot-screen">
  <div class="spinner"></div>
  <h1>Preparando tu experiencia AR</h1>
  <p>Vamos a pedirte permiso de cámara. Apuntá al marcador HIRO para ver la oferta flotando.</p>
</div>

<div id="marker-hint" class="hidden">
  <span class="dot"></span>
  <span>Buscando marcador HIRO…</span>
</div>

<div id="sound-control">
  <button id="sound-toggle" type="button" aria-label="Activar sonido">
    <svg id="sound-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
      <line x1="23" y1="9" x2="17" y2="15"></line>
      <line x1="17" y1="9" x2="23" y2="15"></line>
    </svg>
    <span id="sound-label">Activar sonido</span>
  </button>
  <div id="volume-slider-wrap">
    <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="1">
  </div>
</div>

<!-- ============================================================
     ESCENA AR.js — video sobre marcador HIRO
     ============================================================ -->
<a-scene
  id="ar-scene"
  embedded
  vr-mode-ui="enabled: false"
  renderer="logarithmicDepthBuffer: true; precision: medium; alpha: true;"
  arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3; sourceWidth: 1280; sourceHeight: 960; displayWidth: 1280; displayHeight: 960;"
  loading-screen="enabled: false">

  <a-assets>
    <video
      id="offer-video"
      src="demo-clinica.oferta.mp4.mp4"
      preload="auto"
      loop
      muted
      playsinline
      webkit-playsinline
      crossorigin="anonymous"></video>
  </a-assets>

  <a-marker preset="hiro" id="hiro-marker" emitevents="true">
    <a-entity id="ar-content" scale="0.5 0.5 0.5">
      <a-video
        src="#offer-video"
        width="1.6"
        height="0.9"
        position="0 0.6 0"
        rotation="0 0 0"
        look-at="[camera]"
        material="shader: flat"></a-video>

      <!-- Botones 3D — hijos directos del marcador, visibles solo mientras se trackea -->
      <a-entity id="btn3d-whatsapp" class="btn3d" position="-0.62 -0.15 0.5" look-at="[camera]">
        <a-plane class="clickable" width="0.55" height="0.32" color="#25d366" radius="0.04"
          material="shader: flat; opacity: 0.95"></a-plane>
        <a-text value="💬 WhatsApp" align="center" color="#04211a" width="1.4"
          position="0 0 0.01"></a-text>
      </a-entity>

      <a-entity id="btn3d-cupon" class="btn3d" position="0 -0.15 0.5" look-at="[camera]">
        <a-plane class="clickable" width="0.55" height="0.32" color="#17d1a3" radius="0.04"
          material="shader: flat; opacity: 0.95"></a-plane>
        <a-text id="btn3d-cupon-text" value="🎟️ Copiar Cupón" align="center" color="#04211a" width="1.3"
          position="0 0 0.01"></a-text>
      </a-entity>

      <a-entity id="btn3d-instagram" class="btn3d" position="0.62 -0.15 0.5" look-at="[camera]">
        <a-plane class="clickable" width="0.55" height="0.32" color="#e1306c" radius="0.04"
          material="shader: flat; opacity: 0.95"></a-plane>
        <a-text value="📷 Instagram" align="center" color="#ffffff" width="1.4"
          position="0 0 0.01"></a-text>
      </a-entity>
    </a-entity>
  </a-marker>

  <a-entity camera
    raycaster="objects: .clickable; far: 10"
    cursor="rayOrigin: mouse; fuse: false"></a-entity>
</a-scene>

<div id="toast"></div>

<script>
(function(){
  "use strict";

  const bootScreen   = document.getElementById("boot-screen");
  const markerHint    = document.getElementById("marker-hint");
  const arScene       = document.getElementById("ar-scene");
  const marker         = document.getElementById("hiro-marker");
  const offerVideo     = document.getElementById("offer-video");
  const toastEl         = document.getElementById("toast");
  const soundToggle     = document.getElementById("sound-toggle");
  const soundLabel      = document.getElementById("sound-label");
  const volumeWrap       = document.getElementById("volume-slider-wrap");
  const volumeSlider     = document.getElementById("volume-slider");

  let audioUnlocked   = false;

  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    setTimeout(() => toastEl.classList.remove("show"), 2200);
  }

  // ---- Audio y volumen ----
  function setMuted(muted){
    offerVideo.muted = muted;
    audioUnlocked = !muted;
    soundToggle.classList.toggle("unmuted", !muted);
    soundLabel.textContent = muted ? "Activar sonido" : "Silenciar";
    volumeWrap.classList.toggle("visible", !muted);
  }

  function setVolume(vol){
    offerVideo.volume = vol;
  }

  soundToggle.addEventListener("click", function(){
    setMuted(audioUnlocked);
  });

  volumeSlider.addEventListener("input", function(){
    setVolume(parseFloat(volumeSlider.value));
  });

  function hideBoot(){
    bootScreen.classList.add("hidden");
    setTimeout(() => { bootScreen.style.display = "none"; }, 450);
  }

  // ---- Ciclo de vida del marcador ----
  marker.addEventListener("markerFound", function(){
    markerHint.classList.add("hidden");
    const p = offerVideo.play();
    if (p && p.catch) p.catch(function(){});
  });

  marker.addEventListener("markerLost", function(){
    offerVideo.pause();
    markerHint.classList.remove("hidden");
  });

  // ---- Arranque: cámara lista o no soportada ----
  // Sin video de respaldo: en cualquier escenario, la app termina esperando
  // indefinidamente el marcador HIRO en #marker-hint.
  function boot(){
    const supportsCamera = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);

    function goToWaiting(){
      hideBoot();
      markerHint.classList.remove("hidden");
    }

    if (!supportsCamera) {
      goToWaiting();
      return;
    }

    arScene.addEventListener("arjs-video-loaded", goToWaiting);
    arScene.addEventListener("camera-error", goToWaiting);

    // Failsafe: si arjs-video-loaded nunca dispara, no dejar la pantalla de carga trabada
    setTimeout(function(){
      if (bootScreen.style.display !== "none") goToWaiting();
    }, 8000);
  }

  document.addEventListener("DOMContentLoaded", boot);
  document.addEventListener("DOMContentLoaded", function(){
    logToCRM("Visita recibida en sala de espera");
  });

  // ---- CRM: log a Google Sheets vía Zapier Webhook (4 campos: whatsapp, nombre, tratamiento, estado) ----
  function logToCRM(tratamiento){
    if (!CONFIG.ZAPIER_WEBHOOK_URL || CONFIG.ZAPIER_WEBHOOK_URL.indexOf("PEGAR_URL") !== -1) {
      console.warn("[CRM] ZAPIER_WEBHOOK_URL no configurada, se omite el registro.");
      return;
    }

    const payload = {
      whatsapp: "",
      nombre: "",
      tratamiento: tratamiento,
      estado: "En conversación"
    };

    fetch(CONFIG.ZAPIER_WEBHOOK_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify(payload)
    }).catch(function(err){
      console.warn("[CRM] No se pudo registrar la acción:", err);
    });
  }

  // ---- Botones de acción (usados por los 3 botones 3D) ----
  function handleWhatsappClick(){
    logToCRM(CONFIG.TRATAMIENTO_PROMO);
    const url = "https://wa.me/" + CONFIG.WHATSAPP_NUMBER + "?text=" + encodeURIComponent(CONFIG.WHATSAPP_MESSAGE);
    window.open(url, "_blank");
  }

  function handleInstagramClick(){
    logToCRM(CONFIG.TRATAMIENTO_PROMO);
    window.open("https://instagram.com/" + CONFIG.INSTAGRAM_HANDLE, "_blank");
  }

  function fallbackCopy(text){
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try { document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
  }

  function handleCuponClick(){
    logToCRM(CONFIG.TRATAMIENTO_PROMO);
    const cupon3dText = document.getElementById("btn3d-cupon-text");

    function onCopied(){
      if (cupon3dText) cupon3dText.setAttribute("value", "✅ ¡Copiado!");
      if (window.Swal) {
        Swal.fire({
          title: "¡Cupón copiado!",
          html: "Código: <b>" + CONFIG.CUPON_CODE + "</b><br>Vigencia 24hs desde el copiado. Válido para 1 uso.",
          icon: "success"
        });
      } else {
        showToast("Cupón copiado: " + CONFIG.CUPON_CODE);
      }
      setTimeout(function(){
        if (cupon3dText) cupon3dText.setAttribute("value", "🎟️ Copiar Cupón");
      }, 2000);
    }

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(CONFIG.CUPON_CODE).then(onCopied).catch(function(){
        fallbackCopy(CONFIG.CUPON_CODE);
        onCopied();
      });
    } else {
      fallbackCopy(CONFIG.CUPON_CODE);
      onCopied();
    }
  }

  document.getElementById("btn3d-whatsapp").addEventListener("click", handleWhatsappClick);
  document.getElementById("btn3d-instagram").addEventListener("click", handleInstagramClick);
  document.getElementById("btn3d-cupon").addEventListener("click", handleCuponClick);

})();
</script>

</body>
</html>
